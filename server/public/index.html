<!DOCTYPE html>
<html lang="zh-CN" data-style="coloros">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
<title>悄悄</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="悄悄">
<link rel="stylesheet" href="app.css">
</head>
<body class="booting">
<div id="boot-skeleton">
  <div class="sk-head">消息</div>
  <div class="sk-card"><div class="sk-av"></div><div class="sk-lines"><div class="sk-l w60"></div><div class="sk-l w35"></div></div></div>
  <div class="sk-card"><div class="sk-av"></div><div class="sk-lines"><div class="sk-l w60"></div><div class="sk-l w35"></div></div></div>
  <div class="sk-card"><div class="sk-av"></div><div class="sk-lines"><div class="sk-l w60"></div><div class="sk-l w35"></div></div></div>
  <div class="sk-card"><div class="sk-av"></div><div class="sk-lines"><div class="sk-l w60"></div><div class="sk-l w35"></div></div></div>
</div>
<div id="app">

  <!-- 登录 -->
  <div id="view-auth" class="auth-wrap">
    <div class="auth">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.6"/>
          <path d="M8.2 12.4l2.7 2.7 5-5.4"/>
        </svg>
      </div>
      <h1 id="auth-title">悄悄</h1>
      <p class="sub" id="auth-sub">悄悄说，放心聊</p>
      <div class="err" id="auth-err"></div>
      <div class="field"><label id="lb-account">手机号</label><input id="f-phone" type="text" placeholder="11 位手机号" autocomplete="username"></div>
      <div class="field"><label>密码</label><input id="f-pass" type="password" placeholder="至少 8 位" autocomplete="current-password"></div>
      <div class="field hidden" id="wrap-name"><label>昵称</label><input id="f-name" placeholder="朋友怎么称呼你" maxlength="12"></div>
      <div class="field hidden" id="wrap-captcha"><label>验证码</label>
        <div style="display:flex;gap:9px;align-items:center">
          <input id="f-captcha" placeholder="输入图中字符" maxlength="6" autocomplete="off" style="flex:1">
          <img id="captcha-img" alt="" title="点击换一张" style="height:44px;width:120px;border-radius:9px;cursor:pointer;flex:none;display:block">
        </div>
      </div>
      <button class="btn-primary" id="btn-submit">登录</button>
      <div class="swap"><span id="swap-text">没有账号？</span><a href="#" id="swap-link">去注册</a></div>
    </div>
  </div>

  <!-- 会话列表 -->
  <div id="view-list" class="view hidden">
    <header>
      <div class="title">消息</div>
      <button class="ibtn icon" id="btn-search" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="ibtn bell hidden" id="btn-notify" aria-label="开启通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button class="ibtn round" id="btn-reload" aria-label="刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="ibtn" id="btn-new">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新对话
      </button>
    </header>
    <div class="folder-bar" id="folder-bar"></div>
    <div class="pull-wrap">
      <div class="pull-ind" id="pull-ind"><span class="spin"></span><span class="ptxt" id="pull-txt">下拉刷新</span></div>
      <div class="list" id="conv-list"></div>
    </div>
  </div>

  <!-- 搜索 -->
  <div id="view-search" class="view hidden">
    <header>
      <button class="ibtn round" id="btn-search-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title">搜索</div>
    </header>
    <div class="search-bar"><input id="f-search" placeholder="搜索聊天记录…" autocomplete="off"></div>
    <div class="search-filters" id="search-filters">
      <button class="sf-chip on" data-kinds="">全部</button>
      <button class="sf-chip" data-kinds="text">文字</button>
      <button class="sf-chip" data-kinds="image">图片</button>
      <button class="sf-chip" data-kinds="voice">语音</button>
      <button class="sf-chip" data-kinds="file,video">文件</button>
    </div>
    <div id="search-scope" style="display:none;align-items:center;justify-content:space-between;
      padding:8px 16px;background:var(--brand-soft);font-size:12.5px;color:var(--brand)"></div>
    <div class="list" id="search-results"></div>
  </div>

  <!-- 聊天 -->
  <div id="view-chat" class="view hidden">
    <header>
      <button class="ibtn round" id="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="peer" id="chat-peer-wrap">
        <div class="avatar" id="chat-avatar">?</div>
        <div class="peer-info">
          <div class="peer-name" id="chat-peer">—</div>
          <div class="status" id="chat-status">连接中…</div>
        </div>
      </div>
      <button class="ibtn round hidden" id="btn-jump-date" aria-label="跳到某天">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      </button>
      <button class="ibtn round" id="btn-secret" aria-label="密聊" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
      <button class="ibtn round" id="btn-info" aria-label="会话信息">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </button>
    </header>
    <div id="topic-bar" class="topic-bar hidden"></div>
    <div id="pinned-bar" class="pinned-bar hidden"></div>
    <div id="group-notice" class="group-notice hidden" onclick="openGroupNotice()"></div>
    <div class="msgs" id="msgs"></div>
    <div class="composer" id="composer">
      <button class="attach" id="btn-emoji" aria-label="表情">😊</button>
      <button class="attach" id="btn-attach" aria-label="附件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <textarea id="f-msg" placeholder="说点什么…" rows="1"></textarea>
      <button class="send" id="btn-send" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>


  <!-- 朋友圈 -->
  <div id="view-moments" class="view hidden">
    <header>
      <button class="ibtn round" id="btn-moments-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title">朋友圈</div>
      <button class="ibtn icon" id="btn-moments-post" aria-label="发布">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
      </button>
    </header>
    <div class="list" id="moments-list" style="padding:0"></div>
  </div>

  <!-- 管理后台 -->
  <div id="view-admin" class="view hidden">
    <header>
      <button class="ibtn round" id="btn-admin-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title">管理后台</div>
    </header>
    <div class="list" id="admin-body" style="padding:0"></div>
  </div>

  <!-- 好友 -->
  <div id="view-contacts" class="view hidden">
    <header>
      <div class="title">好友</div>
      <button class="ibtn icon" id="btn-add-friend" aria-label="找人">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M19 8v6M16 11h6"/></svg>
      </button>
    </header>
    <div class="list" id="contacts-list">
      <div class="me-item" id="item-newfriends" style="margin:10px 12px 4px;border-radius:14px">
        <span class="me-ico" style="background:linear-gradient(135deg,#0ea5e9,#22d3ee)">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        </span>
        <span class="me-label">新的朋友</span>
        <span class="me-value" id="newfriends-badge"></span>
        <span class="me-arrow">›</span>
      </div>
    </div>
  </div>

  <!-- 我的 -->
  <div id="view-me" class="view hidden">
    <header>
      <div class="title">我</div>
    </header>

    <div class="list" style="padding:0">
      <!-- 头像区 -->
      <div class="me-card">
        <div class="me-avatar-wrap" id="me-avatar-wrap">
          <div class="avatar me-avatar" id="me-avatar">?</div>
        </div>
        <div class="me-card-info" id="me-info-click">
          <div class="me-card-name" id="me-name">—</div>
          <div class="me-card-id" id="me-id">ID: —</div>
        </div>
        <span class="me-arrow big">›</span>
      </div>

      <div class="me-sec-title">我的</div>
      <div class="me-group">
        <div class="me-item" id="item-moments">
          <span class="me-ico" style="background:linear-gradient(135deg,#f5a623,#f76b1c)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </span>
          <span class="me-label">朋友圈</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item" id="item-stars">
          <span class="me-ico" style="background:linear-gradient(135deg,#f59e0b,#fbbf24)">
            <svg viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
          </span>
          <span class="me-label">我的收藏</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item" id="item-anon">
          <span class="me-ico" style="background:linear-gradient(135deg,#6366f1,#a855f7)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12.5a4.5 4.5 0 0 0 4.5 4.5c2 0 3.6-.7 5.5-2.2 1.9 1.5 3.5 2.2 5.5 2.2A4.5 4.5 0 0 0 22 12.5V8a1 1 0 0 0-1-1h-4.2c-1.5 0-3 .5-4.8 1.6C10.2 7.5 8.7 7 7.2 7H3a1 1 0 0 0-1 1z"/><circle cx="7.6" cy="10.6" r=".75" fill="#fff" stroke="none"/><circle cx="16.4" cy="10.6" r=".75" fill="#fff" stroke="none"/></svg>
          </span>
          <span class="me-label">匿名提问</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item" id="item-checkin">
          <span class="me-ico" style="background:linear-gradient(135deg,#f59e0b,#f97316)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          </span>
          <span class="me-label">今日签到</span>
          <span class="me-value" id="checkin-val">看榜</span>
          <span class="me-arrow">›</span>
        </div>

      </div>

      <div class="me-sec-title">设置</div>
      <div class="me-group">
        <div class="me-item" id="item-notify">
          <span class="me-ico" style="background:linear-gradient(135deg,#f5643c,#f5a623)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          </span>
          <span class="me-label">消息通知</span>
          <span class="me-value" id="me-notify-state">未开启</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item" id="item-chatpref">
          <span class="me-ico" style="background:linear-gradient(135deg,#0ea5e9,#38bdf8)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h6"/></svg>
          </span>
          <span class="me-label">聊天设置</span>
          <span class="me-value" id="cp-val">标准</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item" id="item-privacy">
          <span class="me-ico" style="background:linear-gradient(135deg,#64748b,#94a3b8)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </span>
          <span class="me-label">隐私</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item" id="item-style">
          <span class="me-ico" style="background:linear-gradient(135deg,#6366f1,#a855f7)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="#fff" opacity=".5"/></svg>
          </span>
          <span class="me-label">外观风格</span>
          <span class="me-value" id="me-style-val">玻璃</span>
          <span class="me-arrow">›</span>
        </div>

      </div>

      <div class="me-sec-title">关于</div>
      <div class="me-group">
        <div class="me-item" id="item-feedback">
          <span class="me-ico" style="background:linear-gradient(135deg,#f43f5e,#fb7185)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 8.5 8.5 0 0 1-3.9-.9L3 21l1.9-5.6a8.4 8.4 0 0 1-.9-3.9A8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/><path d="M12 8v4M12 15.5h.01"/></svg>
          </span>
          <span class="me-label">问题反馈</span>
          <span class="me-arrow">›</span>
        </div>
        <div class="me-item" id="item-github">
          <span class="me-ico" style="background:#24292f">
            <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
          </span>
          <span class="me-label">GitHub 仓库</span>
          <span class="me-value" id="me-gh-name">Whisper</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item" id="item-sponsor">
          <span class="me-ico" style="background:linear-gradient(135deg,#f59e0b,#f97316)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-7-9a4 4 0 0 1 7-2.65A4 4 0 0 1 19 12c0 4.65-7 9-7 9z"/></svg>
          </span>
          <span class="me-label">支持开发者</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item" id="item-refresh">
          <span class="me-ico" style="background:linear-gradient(135deg,#0ea5e9,#22d3ee)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          </span>
          <span class="me-label">刷新页面</span>
          <span class="me-arrow">›</span>
        </div>

      </div>

      <div class="me-sec-title">账号</div>
      <div class="me-group">
        <div class="me-item" id="item-switch-account">
          <span class="me-label">切换账号</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item danger" id="item-logout">
          <span class="me-ico" style="background:linear-gradient(135deg,#ef4444,#f87171)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          </span>
          <span class="me-label">退出登录</span>
          <span class="me-arrow">›</span>
        </div>

        <div class="me-item danger" id="item-delete-account">
          <span class="me-label">注销账号</span>
          <span class="me-arrow">›</span>
        </div>

      </div>

      <div class="me-group hidden" id="admin-group">
        <div class="me-item" id="item-admin">
          <span class="me-ico" style="background:linear-gradient(135deg,#8a2be2,#c084fc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>
          </span>
          <span class="me-label">管理后台</span>
          <span class="me-value">开发者</span>
          <span class="me-arrow">›</span>
        </div>
      </div>
      <div style="text-align:center;font-size:11.5px;color:var(--dim);padding:24px 0 40px">
        悄悄话，不外传
        <span class="ver-line">v2.5</span>
      </div>
    </div>
  </div>

  <!-- 全屏特效层 -->
<div id="fx-layer"></div>

<!-- 底部导航 -->
  <nav class="tabbar hidden" id="tabbar">
    <button class="tab on" data-tab="message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
      <span>消息</span>
      <i class="tab-dot hidden" id="tab-dot-msg"></i>
    </button>
    <button class="tab" data-tab="contacts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M18 11h4M20 9v4"/></svg>
      <span>好友</span>
    </button>
    <button class="tab" data-tab="me">
