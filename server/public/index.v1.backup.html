<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>私聊</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #12141a; --panel: #1a1d26; --line: #262b38;
    --text: #e6e9f0; --dim: #8b93a7; --accent: #4c7dff; --mine: #2b4a9e;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    overscroll-behavior: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---------- 登录 ---------- */
  .auth {
    margin: auto; width: 100%; max-width: 380px; padding: 28px 22px;
  }
  .auth h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
  .auth p { color: var(--dim); font-size: 13px; margin: 0 0 24px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 500; color: #fff;
    background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .swap { text-align: center; margin-top: 16px; font-size: 13px; color: var(--dim); }
  .swap a { color: var(--accent); text-decoration: none; }
  .err { color: #ff6b6b; font-size: 13px; min-height: 20px; margin-bottom: 8px; }

  /* ---------- 会话列表 ---------- */
  header {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  header .title { font-weight: 600; flex: 1; }
  header .me { font-size: 12px; color: var(--dim); }
  .icon-btn {
    width: auto; padding: 6px 12px; font-size: 13px; background: transparent;
    border: 1px solid var(--line); color: var(--dim); border-radius: 8px;
  }
  .list { flex: 1; overflow-y: auto; }
  .conv {
    display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line);
    cursor: pointer; align-items: center;
  }
  .conv:active { background: var(--panel); }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-weight: 600; font-size: 16px; color: #fff;
  }
  .conv-main { flex: 1; min-width: 0; }
  .conv-top { display: flex; justify-content: space-between; gap: 8px; }
  .conv-name { font-weight: 500; }
  .conv-time { font-size: 11px; color: var(--dim); flex: none; }
  .conv-last { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    background: #ff4d4f; color: #fff; font-size: 11px; min-width: 18px; height: 18px;
    border-radius: 9px; display: grid; place-items: center; padding: 0 5px;
  }
  .empty { text-align: center; color: var(--dim); font-size: 13px; padding: 40px 20px; }

  /* ---------- 聊天 ---------- */
  .chat-head { display: flex; align-items: center; gap: 10px; }
  .back { background: none; border: 0; color: var(--accent); font-size: 15px; width: auto; padding: 4px 0; cursor: pointer; }
  .status { font-size: 11px; color: var(--dim); }
  .status.online { color: #4ade80; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 76%; padding: 9px 13px; border-radius: 16px; word-break: break-word; white-space: pre-wrap; }
  .msg.mine { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 4px; }
  .msg.theirs { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 10px; color: var(--dim); margin-top: 3px; text-align: right; }
  .msg.pending { opacity: .55; }
  /* 图片消息：气泡收紧，图片圆角 */
  .msg.has-img { padding: 4px; max-width: 62%; }
  .msg-img {
    display: block; max-width: 100%; max-height: 320px; border-radius: 13px;
    cursor: zoom-in; background: #0b0d12;
  }
  .msg.has-img .meta { padding: 0 8px 2px; }
  /* 全屏看图 */
  .viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 200;
    display: grid; place-items: center; padding: 12px;
  }
  .viewer img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  .viewer .close {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 16px;
    width: auto; padding: 8px 16px; background: rgba(255,255,255,.12); border-radius: 20px;
    color: #fff; font-size: 14px;
  }
  .attach {
    width: 44px; flex: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; color: var(--dim); font-size: 19px; line-height: 1;
  }
  .composer {
    display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line);
    background: var(--panel); padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  .composer input { flex: 1; }
  .composer button { width: auto; padding: 12px 20px; }

  /* ---------- 新建会话 ---------- */
  .sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 20px;
  }
  .sheet-inner { background: var(--panel); border-radius: 14px; padding: 20px; width: 100%; max-width: 340px; }
  .sheet-inner h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .sheet-inner .row { display: flex; gap: 8px; margin-top: 14px; }
  .sheet-inner .row button { flex: 1; }
  .sheet-inner .row .ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); }
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: #333a4a; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 20px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">

  <!-- 登录 / 注册 -->
  <div id="view-auth" class="auth">
    <h1>私聊</h1>
    <p>只有拿到邀请码的人能进来</p>
    <div class="err" id="auth-err"></div>
    <div class="field"><label>手机号</label><input id="f-phone" type="tel" inputmode="numeric" placeholder="11 位手机号" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="f-pass" type="password" placeholder="至少 8 位" autocomplete="current-password"></div>
    <div class="field hidden" id="wrap-name"><label>昵称</label><input id="f-name" placeholder="朋友怎么称呼你" maxlength="12"></div>
    <div class="field hidden" id="wrap-invite"><label>邀请码</label><input id="f-invite" placeholder="8 位邀请码" autocapitalize="characters"></div>
    <button id="btn-submit">登录</button>
    <div class="swap"><span id="swap-text">没有账号？</span> <a href="#" id="swap-link">去注册</a></div>
  </div>

  <!-- 会话列表 -->
  <div id="view-list" class="hidden" style="display:flex;flex-direction:column;height:100%">
    <header>
      <div class="title">消息</div>
      <div class="me" id="me-name"></div>
      <button class="icon-btn" id="btn-new">＋ 新对话</button>
      <button class="icon-btn" id="btn-logout">退出</button>
    </header>
    <div class="list" id="conv-list">
      <div class="empty">还没有对话，点右上角「新对话」</div>
    </div>
  </div>

  <!-- 聊天 -->
  <div id="view-chat" class="hidden" style="display:flex;flex-direction:column;height:100%">
    <header class="chat-head">
      <button class="back" id="btn-back">‹ 返回</button>
      <div class="title" id="chat-peer">—</div>
      <div class="status" id="chat-status"></div>
    </header>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <button class="attach" id="btn-img" title="发图片">＋</button>
      <input type="file" id="f-img" accept="image/*" class="hidden">
      <input id="f-msg" placeholder="说点什么…" autocomplete="off">
      <button id="btn-send">发送</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   极简客户端：单文件、无框架、无构建
   状态全在内存 + localStorage(token)，刷新后自动恢复登录
   ============================================================ */

const $ = (id) => document.getElementById(id);
const state = {
  token: localStorage.getItem('im_token') || '',
  me: null,
  mode: 'login',        // login | register
  convs: [],
  activeConv: null,     // { id, peer }
  msgs: new Map(),      // convId -> [{id,senderId,body,seq,createdAt,pending}]
  ws: null,
  wsRetry: 0,
  online: new Set(),
};

/* ---------- 小工具 ---------- */
let toastTimer;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
function hhmm(ts) {
  const d = new Date(ts);
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function clockLabel(ts) {
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return hhmm(ts);
  const y = new Date(now.getTime() - 864e5);
  if (d.toDateString() === y.toDateString()) return '昨天';
  return (d.getMonth() + 1) + '/' + d.getDate();
}
const avatarColor = (name) => {
  let h = 0;
  for (const ch of name || '?') h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h},45%,42%)`;
};
const initial = (name) => (name || '?').trim().slice(0, 1);

/* ---------- HTTP ---------- */
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error((data && data.error) || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ---------- 视图切换 ---------- */
function show(view) {
  for (const v of ['view-auth', 'view-list', 'view-chat']) {
    $(v).classList.toggle('hidden', v !== view);
  }
  if (view === 'view-chat') setTimeout(() => $('f-msg').focus(), 60);
}

/* ---------- 登录 / 注册 ---------- */
function setAuthMode(mode) {
  state.mode = mode;
  const isReg = mode === 'register';
  $('wrap-name').classList.toggle('hidden', !isReg);
  $('wrap-invite').classList.toggle('hidden', !isReg);
  $('btn-submit').textContent = isReg ? '注册' : '登录';
  $('swap-text').textContent = isReg ? '已有账号？' : '没有账号？';
  $('swap-link').textContent = isReg ? '去登录' : '去注册';
  $('auth-err').textContent = '';
}

$('swap-link').addEventListener('click', (e) => {
  e.preventDefault();
  setAuthMode(state.mode === 'login' ? 'register' : 'login');
});

$('btn-submit').addEventListener('click', async () => {
  const phone = $('f-phone').value.trim();
  const password = $('f-pass').value;
  const errEl = $('auth-err');
  errEl.textContent = '';
  if (!phone || !password) { errEl.textContent = '手机号和密码都要填'; return; }

  const btn = $('btn-submit');
  btn.disabled = true;
  try {
    let payload;
    if (state.mode === 'register') {
      payload = { phone, password, name: $('f-name').value.trim(), invite: $('f-invite').value.trim() };
      var out = await api('POST', '/api/auth/register', payload);
    } else {
      out = await api('POST', '/api/auth/login', { phone, password });
    }
    state.token = out.token;
    state.me = out.user;
    localStorage.setItem('im_token', out.token);
    await enterApp();
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
});

/* ---------- 进入主界面 ---------- */
async function enterApp() {
  if (!state.me) {
    const r = await api('GET', '/api/me');
    state.me = r.user;
  }
  $('me-name').textContent = state.me.name;
  show('view-list');
  connectWs();
  await refreshConvs();
}

async function refreshConvs() {
  try {
    const r = await api('GET', '/api/conversations');
    state.convs = r.conversations;
    renderConvs();
  } catch (e) {
    if (e.status === 401) logout();
  }
}

function renderConvs() {
  const list = $('conv-list');
  if (!state.convs.length) {
    list.innerHTML = '<div class="empty">还没有对话，点右上角「新对话」</div>';
    return;
  }
  list.innerHTML = state.convs.map((c) => {
    const name = c.peer ? c.peer.name : '未知';
    const last = c.lastMessage;
    const preview = !last ? '还没有消息'
      : (last.senderId === state.me.id ? '我：' : '') + (last.body || '').slice(0, 40);
    return `<div class="conv" data-id="${c.id}">
      <div class="avatar" style="background:${avatarColor(name)}">${esc(initial(name))}</div>
      <div class="conv-main">
        <div class="conv-top">
          <span class="conv-name">${esc(name)}</span>
          <span class="conv-time">${last ? clockLabel(last.createdAt) : ''}</span>
        </div>
        <div class="conv-top">
          <span class="conv-last">${esc(preview)}</span>
          ${c.unread ? `<span class="badge">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.conv').forEach((el) => {
    el.addEventListener('click', () => openConv(el.dataset.id));
  });
}

/* ---------- 会话 ---------- */
async function openConv(convId) {
  const conv = state.convs.find((c) => c.id === convId);
  state.activeConv = conv || { id: convId, peer: null };
  $('chat-peer').textContent = conv && conv.peer ? conv.peer.name : '对话';
  show('view-chat');
  $('msgs').innerHTML = '<div class="empty">加载中…</div>';

  try {
    const r = await api('GET', `/api/conversations/${convId}/messages?limit=50`);
    state.msgs.set(convId, r.messages);
    renderMsgs();
    // 已读
    const maxSeq = r.messages.reduce((m, x) => Math.max(m, x.seq), 0);
    if (maxSeq) {
      api('POST', `/api/conversations/${convId}/read`, { seq: maxSeq }).catch(() => {});
      const c = state.convs.find((x) => x.id === convId);
      if (c) { c.unread = 0; renderConvs(); }
    }
  } catch (e) {
    $('msgs').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

function imgSrc(m) {
  // 本地 blob 优先：正在上传或刚发的图，避免闪一下空白
  if (m.localUrl) return m.localUrl;
  return `/api/images/${m.body}?token=${encodeURIComponent(state.token)}`;
}

function openViewer(src) {
  const viewer = document.createElement('div');
  viewer.className = 'viewer';
  viewer.innerHTML = `<img src="${src}" alt=""><button class="close">关闭</button>`;
  document.body.appendChild(viewer);
  const close = () => viewer.remove();
  viewer.addEventListener('click', (e) => {
    if (e.target === viewer || e.target.classList.contains('close')) close();
  });
}

function renderMsgs() {
  const convId = state.activeConv && state.activeConv.id;
  if (!convId) return;
  const list = state.msgs.get(convId) || [];
  const box = $('msgs');
  if (!list.length) {
    box.innerHTML = '<div class="empty">还没有消息，说点什么吧</div>';
    return;
  }
  box.innerHTML = list.map((m) => {
    const mine = m.senderId === state.me.id;
    const isImg = m.kind === 'image';
    const content = isImg
      ? `<img class="msg-img" src="${imgSrc(m)}" alt="图片">`
      : esc(m.body);
    return `<div class="msg ${mine ? 'mine' : 'theirs'} ${m.pending ? 'pending' : ''} ${isImg ? 'has-img' : ''}">${content}<div class="meta">${hhmm(m.createdAt)}${m.pending ? ' · 发送中' : ''}</div></div>`;
  }).join('');
  box.querySelectorAll('.msg-img').forEach((img) => {
    img.addEventListener('click', () => openViewer(img.src));
  });
  box.scrollTop = box.scrollHeight;
}

function appendMsg(convId, msg) {
  const list = state.msgs.get(convId) || [];
  if (list.some((m) => m.id === msg.id)) return;
  list.push(msg);
  list.sort((a, b) => (a.seq || 0) - (b.seq || 0));
  state.msgs.set(convId, list);
  if (state.activeConv && state.activeConv.id === convId && !$('view-chat').classList.contains('hidden')) {
    renderMsgs();
  }
}

/* ---------- 发送 ---------- */
async function sendMsg() {
  const input = $('f-msg');
  const body = input.value.trim();
  if (!body || !state.activeConv) return;
  const convId = state.activeConv.id;
  const clientId = crypto.randomUUID();

  // 乐观显示：先把气泡放上去，ack 回来再换成真身
  const tmp = { id: 'tmp-' + clientId, clientId, senderId: state.me.id, body, seq: 0, createdAt: Date.now(), pending: true };
  const list = state.msgs.get(convId) || [];
  list.push(tmp);
  state.msgs.set(convId, list);
  renderMsgs();
  input.value = '';

  if (!state.ws || state.ws.readyState !== 1) {
    toast('连接已断开，正在重连…');
    connectWs();
    return;
  }
  state.ws.send(JSON.stringify({ t: 'send', convId, clientId, body }));
}

$('btn-send').addEventListener('click', sendMsg);
$('f-msg').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

/* ---------- 发图片 ---------- */
async function uploadImage(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/api/upload', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + state.token },
    body: fd,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '上传失败');
  return data; // { id, url, size, mime }
}

$('btn-img').addEventListener('click', () => {
  if (!state.activeConv) { toast('先打开一个对话'); return; }
  $('f-img').click();
});

$('f-img').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = ''; // 允许连续选同一张
  if (!file || !state.activeConv) return;
  if (file.size > 5 * 1024 * 1024) { toast('图片不能超过 5MB'); return; }

  const convId = state.activeConv.id;
  const clientId = crypto.randomUUID();
  const localUrl = URL.createObjectURL(file);
  const list = state.msgs.get(convId) || [];

  // 先本地预览，用户立刻看到图
  const tmp = {
    id: 'tmp-' + clientId, clientId, senderId: state.me.id,
    body: '', kind: 'image', localUrl, seq: 0, createdAt: Date.now(), pending: true,
  };
  list.push(tmp);
  state.msgs.set(convId, list);
  renderMsgs();

  try {
    const up = await uploadImage(file);
    tmp.body = up.id; // 拿到 id 后即使重渲染也能取到图
    renderMsgs();

    if (!state.ws || state.ws.readyState !== 1) {
      toast('连接已断开，图片待重发');
      return;
    }
    state.ws.send(JSON.stringify({ t: 'send', convId, clientId, body: up.id, kind: 'image' }));
  } catch (err) {
    const l = state.msgs.get(convId) || [];
    const i = l.findIndex((x) => x.clientId === clientId);
    if (i >= 0) l.splice(i, 1);
    state.msgs.set(convId, l);
    renderMsgs();
    toast(err.message || '上传失败');
  }
});
$('btn-back').addEventListener('click', () => {
  state.activeConv = null;
  show('view-list');
  refreshConvs();
});

/* ---------- 新建对话 ---------- */
$('btn-new').addEventListener('click', () => {
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `<div class="sheet-inner">
    <h3>发起新对话</h3>
    <input id="f-peer" placeholder="对方的手机号" inputmode="numeric">
    <div class="row">
      <button class="ghost" id="sheet-cancel">取消</button>
      <button id="sheet-ok">开始</button>
    </div>
  </div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  sheet.addEventListener('click', (e) => { if (e.target === sheet) close(); });
  sheet.querySelector('#sheet-cancel').addEventListener('click', close);
  sheet.querySelector('#sheet-ok').addEventListener('click', async () => {
    const phone = sheet.querySelector('#f-peer').value.trim();
    if (!phone) return;
    try {
      const r = await api('POST', '/api/conversations', { phone });
      close();
      await refreshConvs();
      openConv(r.conversationId);
    } catch (e) {
      toast(e.message);
    }
  });
  setTimeout(() => sheet.querySelector('#f-peer').focus(), 50);
});

/* ---------- 退出 ---------- */
function logout() {
  state.token = '';
  state.me = null;
  localStorage.removeItem('im_token');
  if (state.ws) { try { state.ws.close(); } catch {} }
  state.ws = null;
  show('view-auth');
}
$('btn-logout').addEventListener('click', async () => {
  try { await api('POST', '/api/auth/logout'); } catch {}
  logout();
});

/* ---------- WebSocket ---------- */
function connectWs() {
  if (!state.token) return;
  if (state.ws && (state.ws.readyState === 0 || state.ws.readyState === 1)) return;

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(state.token)}`);
  state.ws = ws;

  ws.addEventListener('open', () => {
    state.wsRetry = 0;
    setChatStatus('已连接', true);
    // 重连后把当前会话的缺口补齐
    if (state.activeConv) {
      const list = state.msgs.get(state.activeConv.id) || [];
      const since = list.reduce((m, x) => Math.max(m, x.seq || 0), 0);
      api('GET', `/api/conversations/${state.activeConv.id}/sync?since=${since}`)
        .then((r) => r.messages.forEach((m) => appendMsg(state.activeConv.id, m)))
        .catch(() => {});
    }
  });

  ws.addEventListener('close', () => {
    setChatStatus('重连中…', false);
    state.ws = null;
    // 指数退避，最多 15 秒
    const delay = Math.min(15000, 1000 * Math.pow(1.6, state.wsRetry++));
    setTimeout(connectWs, delay);
  });

  ws.addEventListener('error', () => setChatStatus('连接异常', false));

  ws.addEventListener('message', (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    handleWs(m);
  });
}

function handleWs(m) {
  switch (m.t) {
    case 'hello':
      if (!state.me) state.me = m.user;
      setChatStatus('已连接', true);
      break;

    case 'ack': {
      const convId = state.activeConv && state.activeConv.id;
      const list = convId ? state.msgs.get(convId) : null;
      if (list) {
        const old = list.find((x) => x.clientId === m.clientId);
        const localUrl = old && old.localUrl;
        const i = list.findIndex((x) => x.clientId === m.clientId);
        if (i >= 0) list.splice(i, 1);
        // 把本地预览地址接到正式消息上，避免图片重新加载闪白
        if (localUrl) m.message.localUrl = localUrl;
        if (!list.some((x) => x.id === m.message.id)) list.push(m.message);
        list.sort((a, b) => (a.seq || 0) - (b.seq || 0));
        renderMsgs();
      }
      refreshConvs();
      break;
    }

    case 'message': {
      const msg = m.message;
      appendMsg(msg.convId, msg);
      const isCurrent = state.activeConv && state.activeConv.id === msg.convId
        && !$('view-chat').classList.contains('hidden');
      if (isCurrent) {
        api('POST', `/api/conversations/${msg.convId}/read`, { seq: msg.seq }).catch(() => {});
      }
      refreshConvs();
      break;
    }

    case 'read':
      // 对方已读，可以在这里更新"已读"标记（极简版先不显示）
      break;

    case 'presence':
      if (m.online) state.online.add(m.userId); else state.online.delete(m.userId);
      updatePeerStatus();
      break;
  }
}

function setChatStatus(text, ok) {
  const el = $('chat-status');
  el.textContent = text;
  el.classList.toggle('online', !!ok);
}

function updatePeerStatus() {
  if (!state.activeConv || !state.activeConv.peer) return;
  const on = state.online.has(state.activeConv.peer.id);
  setChatStatus(on ? '在线' : '已连接', on);
}

/* ---------- 启动 ---------- */
(async function boot() {
  setAuthMode('login');
  if (!state.token) { show('view-auth'); return; }
  try {
    await enterApp();
  } catch (e) {
    logout();
  }
})();

// 切回前台时，如果 WS 断了就重连
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.token && !state.ws) connectWs();
});
</script>
