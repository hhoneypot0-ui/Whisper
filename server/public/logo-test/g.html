<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>嘘 · 官方表情版</title><style>
body{margin:0;background:#f7f7fa;font-family:-apple-system,"PingFang SC",sans-serif;padding:28px 16px}
h1{font-size:17px;text-align:center;margin:0 0 6px;color:#14161c;font-weight:600}
.sub{text-align:center;font-size:12.5px;color:#8a90a0;margin:0 0 26px}
.wrap{max-width:360px;margin:0 auto;text-align:center}
.wrap > img{width:210px;border-radius:50px;box-shadow:0 14px 36px rgba(16,20,32,.18);display:block;margin:0 auto}
.row{margin-top:24px;display:flex;align-items:flex-end;justify-content:center;gap:14px}
.row .it{text-align:center}
.row img{display:block;border-radius:11px;box-shadow:0 3px 10px rgba(16,20,32,.12);margin:0 auto}
.row .it:nth-child(1) img{width:56px;border-radius:13px}
.row .it:nth-child(2) img{width:40px;border-radius:10px}
.row .it:nth-child(3) img{width:28px;border-radius:8px}
.row .it:nth-child(4) img{width:20px;border-radius:6px}
.row p{font-size:10.5px;color:#8a90a0;margin:6px 0 0}
.tip{margin:26px auto 0;max-width:340px;font-size:12.5px;color:#5a6072;line-height:1.8;background:#fff;padding:14px 16px;border-radius:12px}
</style></head><body>
<h1>🤫 悄悄</h1>
<p class="sub">Noto 官方表情 + 渐变底</p>
<div class="wrap">
  <img src="G1.png" alt="">
  <div class="row">
    <div class="it"><img src="G1.png" alt=""><p>56px</p></div>
    <div class="it"><img src="G1.png" alt=""><p>40px</p></div>
    <div class="it"><img src="G1.png" alt=""><p>28px</p></div>
    <div class="it"><img src="G1.png" alt=""><p>20px</p></div>
  </div>
  <div class="tip">下面四档是主屏图标、通知栏、设置列表的真实大小<br>看最小那个还认不认得出「在比嘘」</div>
</div>
</body></html>
